name: AppImage Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: appimage-ubuntu22
      - name: Install build and media runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libfuse2 file policykit-1 ca-certificates ffmpeg gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav xvfb dbus-x11
      - name: Verify source and packaging
        run: |
          python3 scripts/check-release-version.py
          python3 scripts/test-release-scripts.py
          python3 scripts/test-user-install.py
          cargo test --locked -p reelio-artwork --lib
      - name: Build AppImage on the oldest supported Ubuntu baseline
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          npm ci
          npm test
          python3 ../../scripts/prepare-appimage.py
          npm run tauri build -- --bundles appimage --config ../../target/appimage-bundle.json
      - name: Smoke-test the extracted AppImage on a native display
        shell: bash
        run: |
          set -euo pipefail
          image=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -type f -print -quit)
          test -n "$image"
          image=$(realpath "$image")
          chmod +x "$image"
          mkdir -p target/appimage-smoke
          cd target/appimage-smoke
          "$image" --appimage-extract >/dev/null
          mkdir -p data config cache
          set +e
          timeout --kill-after=5s 25s xvfb-run -a dbus-run-session -- env WEBKIT_DISABLE_COMPOSITING_MODE=1 XDG_DATA_HOME="$PWD/data" XDG_CONFIG_HOME="$PWD/config" XDG_CACHE_HOME="$PWD/cache" ./squashfs-root/AppRun >startup.log 2>&1
          result=$?
          set -e
          cat startup.log
          test "$result" -eq 124
          python3 ../../scripts/check-appimage-smoke.py startup.log
      - name: Produce release checksum manifest
        run: python3 scripts/collect-release-assets.py target/release/bundle/appimage target/appimage-release
      - uses: actions/upload-artifact@v4
        with:
          name: reelio-appimage-x86_64
          path: |
            target/appimage-release/*
            target/appimage-smoke/startup.log
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reelio-appimage-diagnostics
          path: target/appimage-smoke/startup.log
          if-no-files-found: ignore
